<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCEAN DESK | Coastal World Preview</title><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#16324b}*{box-sizing:border-box}body{margin:0;background:#dceefa}canvas{display:block;width:100vw;height:100dvh}.brand{position:fixed;top:20px;left:24px;color:white;text-shadow:0 2px 12px #1640637d;pointer-events:none}.brand h1{font:clamp(26px,4vw,48px) Georgia,serif;letter-spacing:.06em;margin:0}.brand p{margin:5px 0;font-size:13px}.panel{position:fixed;right:20px;top:20px;width:min(310px,calc(100vw - 40px));background:#f9faf8ed;backdrop-filter:blur(15px);padding:16px;border-radius:20px;box-shadow:0 15px 55px #1c42552a}.panel h2{margin:0 0 10px;font-size:15px}button{border:0;cursor:pointer;background:#e8f1ee;color:#244d5a;padding:10px 12px;border-radius:10px;font-weight:700}button:hover{background:#d1e5e5}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#f9faf8ee;backdrop-filter:blur(15px);border-radius:18px;padding:12px;box-shadow:0 10px 35px #18394b37;white-space:nowrap}.bottom strong{font-variant-numeric:tabular-nums;font-size:23px;min-width:70px;text-align:center}.status{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);border-radius:50px;background:#16324bcf;color:white;padding:8px 16px;font-size:12px;text-align:center;max-width:90vw}.disclaimer{position:fixed;left:20px;bottom:20px;color:white;font-size:11px;text-shadow:0 1px 5px #16324b}.panel small{display:block;color:#607781;line-height:1.45;margin-top:10px}@media(max-width:700px){.brand{top:12px;left:12px}.brand h1{font-size:23px}.brand p{font-size:10px}.panel{top:86px;right:10px;width:200px;padding:11px}.options{grid-template-columns:1fr}.bottom{bottom:12px;padding:8px;gap:6px}.bottom button{padding:9px 7px;font-size:11px}.bottom strong{font-size:17px;min-width:50px}.disclaimer{display:none}}</style></head><body>
<div class="brand"><h1>OCEAN DESK</h1><p>A PLACE TO FOCUS AND BE WELL</p></div><div id="world"></div>
<div class="panel"><h2>어디로 가시겠어요?</h2><div class="options"><button id="plaza">🌊 바다 광장</button><button id="cafe">☕ 오션뷰 카페 · 입장</button><button id="library">📚 오션뷰 도서관 · 입장</button><button id="overview">🧭 전체 보기</button></div><small>마우스로 시점 회전 · 휠로 확대 · 표지판 클릭으로 이동<br>프리미엄 디자인 방향을 검증하는 3D 시범 장면입니다.</small></div>
<div class="status" id="status">바다 광장에 오신 것을 환영합니다</div><div class="bottom"><button id="wave">🔇 파도 OFF</button><button data-time="25">25분</button><button data-time="50">50분</button><strong id="timer">25:00</strong><button id="start">시작</button><button id="reset">↻</button></div><span class="disclaimer">CONCEPT PREVIEW · 실시간 다중접속 미연결</span>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import {OrbitControls} from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const el=document.querySelector('#world'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9bcee9);scene.fog=new THREE.FogExp2(0x9bcee9,.007);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,400);camera.position.set(3,10,25);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;el.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=65;controls.maxPolarAngle=Math.PI*.49;controls.target.set(0,3,-5);
scene.add(new THREE.HemisphereLight(0xffffff,0x759dba,2.15));const sun=new THREE.DirectionalLight(0xffe5b9,2.3);sun.position.set(-25,35,-28);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);
const mat=(c,rough=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});const white=mat(0xf7efe2),stone=mat(0xe9dcc8),wood=mat(0x9e7048),deepWood=mat(0x704b34),green=mat(0x648c56),pink=mat(0xce5683),gold=mat(0xe0b778),glass= new THREE.MeshStandardMaterial({color:0xa2d9e7,metalness:.08,roughness:.13,transparent:true,opacity:.44});
function mesh(geo,m,x,y,z,group=scene){let o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;group.add(o);return o}
function box(w,h,d,m,x,y,z,g){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,g)}
function cylinder(rt,rb,h,m,x,y,z,g){return mesh(new THREE.CylinderGeometry(rt,rb,h,20),m,x,y,z,g)}
function sphere(r,m,x,y,z,g){return mesh(new THREE.SphereGeometry(r,12,10),m,x,y,z,g)}
function terrace(x,z,w,d,y=0){box(w,1,d,stone,x,y-.5,z);box(w,.13,d,white,x,y+.04,z)}
// sea stretches behind the cliff, with subtly animated wave material
const watergeo=new THREE.PlaneGeometry(350,220,32,24);const watermat=new THREE.MeshStandardMaterial({color:0x1376a6,roughness:.37,metalness:.25,transparent:true,opacity:.96,flatShading:true});const water=mesh(watergeo,watermat,0,-4,-95);water.rotation.x=-Math.PI/2;const base=watergeo.attributes.position;const baseX=[],baseY=[];for(let i=0;i<base.count;i++){baseX.push(base.getX(i));baseY.push(base.getY(i))}
box(80,4,62,stone,0,-4,17);terrace(0,0,15,12,0);terrace(-17,-3,19,17,.4);terrace(17,-3,19,17,.4);
for(let i=0;i<14;i++){let x=-27+i*4;box(2,.45,2,white,x,-.4,17+Math.sin(i)*.6)}
// steps and linking stone paths
for(let i=0;i<7;i++)box(5,.19,.9,white,0,.14+i*.04,6+i*1.1);
for(let i=0;i<9;i++){let a=i/8*Math.PI;box(.36,.72,.5,white,7*Math.cos(a),.4,7*Math.sin(a)-2)}
// buildings: high-end white stucco, transparent ocean-facing arches, tiled balconies
function building(x,library=false){const g=new THREE.Group();scene.add(g);g.position.set(x,.4,-3);box(17,.4,13,white,0,.15,0,g);
box(1.1,8,13,white,-8,4,0,g);box(1.1,8,13,white,8,4,0,g);box(17,8,.8,white,0,4,6,g);box(17,.55,13,white,0,8.4,0,g);
for(let i=0;i<4;i++){let ax=-5.7+i*3.8;box(.7,6.9,.7,white,ax,.95,-6,g);let arch=mesh(new THREE.TorusGeometry(1.52,.35,8,20,Math.PI),white,ax+1.9,6.6,-6,g);arch.rotation.z=Math.PI/2;arch.scale.set(1,1,1)}
for(let i=0;i<7;i++)box(.16,.9,.16,gold,-7+i*2.2,8.8,6,g);
for(let i=0;i<8;i++){const col=i%4,row=Math.floor(i/4),px=-5.6+col*3.65,pz=-2.6+row*5;
if(library){box(2.4,.18,1.2,wood,px,1.45,pz,g);box(.16,1.25,.13,deepWood,px-.9,.8,pz-.45,g);box(.16,1.25,.13,deepWood,px+.9,.8,pz+.45,g);box(1.15,.2,.9,deepWood,px,.65,pz+1.3,g);cylinder(.15,.18,.65,gold,px,1.86,pz,g);sphere(.28,mat(0xffe2a1),px,2.25,pz,g)}
else{cylinder(1.03,.97,.15,white,px,1.3,pz,g);cylinder(.15,.15,1.16,wood,px,.7,pz,g);box(1.1,.18,.94,wood,px,.7,pz+1.36,g);box(1.1,.9,.13,wood,px,1.17,pz+1.79,g);cylinder(.22,.2,.18,mat(0xffffff),px,1.47,pz,g)}}
if(library){for(let i=0;i<5;i++){let xx=-7+i*3.5;box(2.5,5.8,.46,deepWood,xx,3.1,5.4,g);for(let j=0;j<5;j++)box(2.2,.42,.2,mat([0x3d6175,0xa88155,0x60745a][j%3]),xx,1.3+j*.85,5.04,g)}}
else{for(let i=0;i<4;i++){let xx=-6+i*4;cylinder(.31,.23,.45,stone,xx,.56,4,g);sphere(.6,green,xx,1.26,4,g)}}
return g}
building(-17,false);building(17,true);
// courtyard fountain and bronze sculpture
cylinder(2.7,2.7,.65,white,0,.55,-1);cylinder(2.15,2.15,.05,mat(0x68b7c9,.15),0,.94,-1);cylinder(.2,.3,1.9,gold,0,1.8,-1);
const ring=mesh(new THREE.TorusGeometry(1.3,.11,10,40),gold,0,3,-1);ring.rotation.y=.3;
// signpost with readable canvas labels in 3D
function signTexture(label){let c=document.createElement('canvas');c.width=512;c.height=120;const k=c.getContext('2d');k.fillStyle='#74513b';k.fillRect(0,0,512,120);k.fillStyle='#fff4de';k.font='bold 45px Georgia,serif';k.textAlign='center';k.fillText(label,256,77);return new THREE.CanvasTexture(c)}
cylinder(.17,.24,4.3,wood,1.9,2.2,3);[['오션뷰 카페',3.45,-.18],['오션뷰 도서관',2.75,.18],['PRIVATE DESK',2.05,-.13]].forEach(([name,y,rot])=>{const m=new THREE.MeshBasicMaterial({map:signTexture(name)});let s=mesh(new THREE.PlaneGeometry(3.3,.76),m,1.9,y,3.3);s.rotation.y=rot;s.userData.destination=name});
for(let i=0;i<35;i++){let x=(Math.random()-.5)*57,z=(Math.random()-.5)*29+6;if(Math.abs(x)<9&&z<12)continue;let y=-.2;let r=.4+Math.random()*.65;cylinder(.2,.27,.7,stone,x,y+.3,z);sphere(r,Math.random()<.38?pink:green,x,y+1,z)}
for(let i=0;i<15;i++){let x=-29+Math.random()*58,z=-15+Math.random()*30;if(Math.abs(x)<10&&z>0)continue;cylinder(.08,.1,2.1,deepWood,x,1,z);sphere(.8,green,x,2.2,z)}
// camera navigation presets
const poses={plaza:[[1,7,20],[0,2,-6]],cafe:[[-16,4.5,3],[-17,2,-5]],library:[[17,4.5,3],[17,2,-5]],overview:[[1,33,36],[0,1,-6]]};let targetPos=camera.position.clone(),targetLook=controls.target.clone();
function go(where){let p=poses[where];targetPos.set(...p[0]);targetLook.set(...p[1]);document.querySelector('#status').textContent={plaza:'해안가 중앙 광장',cafe:'오션뷰 카페 · 8석',library:'오션뷰 도서관 · 8석',overview:'오션 데스크 전체 조감도'}[where]}
for(let id of Object.keys(poses))document.getElementById(id).onclick=()=>go(id);
let down=null;renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>8)return;const m=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1),r=new THREE.Raycaster();r.setFromCamera(m,camera);let hits=r.intersectObjects(scene.children,true);const a=hits.find(h=>h.object.userData.destination);if(a)go(a.object.userData.destination.includes('카페')?'cafe':a.object.userData.destination.includes('도서관')?'library':'plaza')});
// Browser gesture-gated generated waves, no external copyrighted music
let actx=null,noise=null,filter=null,gain=null;let on=false;document.querySelector('#wave').onclick=async()=>{if(!actx){actx=new AudioContext();let buf=actx.createBuffer(1,actx.sampleRate*3,actx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;noise=actx.createBufferSource();noise.buffer=buf;noise.loop=true;filter=actx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=380;gain=actx.createGain();gain.gain.value=0;noise.connect(filter).connect(gain).connect(actx.destination);noise.start()}await actx.resume();on=!on;gain.gain.setTargetAtTime(on?.15:0,actx.currentTime,.25);document.querySelector('#wave').textContent=on?'🌊 파도 ON':'🔇 파도 OFF'};
let time=25*60,preset=25*60,running=false,last=performance.now();function ttext(){document.querySelector('#timer').textContent=String(Math.floor(time/60)).padStart(2,'0')+':'+String(Math.floor(time%60)).padStart(2,'0')}document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{preset=Number(b.dataset.time)*60;time=preset;running=false;document.querySelector('#start').textContent='시작';ttext()});document.querySelector('#start').onclick=()=>{running=!running;document.querySelector('#start').textContent=running?'일시정지':'시작';last=performance.now()};document.querySelector('#reset').onclick=()=>{time=preset;running=false;document.querySelector('#start').textContent='시작';ttext()};
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}window.addEventListener('resize',resize);go('plaza');function loop(now){requestAnimationFrame(loop);let dt=Math.min(.1,(now-last)/1000);last=now;if(running){time=Math.max(0,time-dt);if(time===0)running=false;ttext()}let pos=watergeo.attributes.position;for(let i=0;i<pos.count;i++)pos.setZ(i,.2*Math.sin(baseX[i]*.15+now*.0009)+.12*Math.cos(baseY[i]*.2+now*.0012));pos.needsUpdate=true;camera.position.lerp(targetPos,.035);controls.target.lerp(targetLook,.035);controls.update();renderer.render(scene,camera)}resize();requestAnimationFrame(loop);
</script></body></html>
