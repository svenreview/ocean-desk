name: Ocean Desk MVP browser checks
on:
  pull_request:
    paths:
      - index.html
      - od-account.js
      - od-auth-flow.mjs
      - od-config-validator.mjs
      - od-runtime-config.js
      - od-focus-sync.js
      - od-wallet-bootstrap.mjs
      - tests/**
      - .github/workflows/ocean-desk-smoke.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ocean-desk-server.log 2>&1 &
      - name: Run auth and wallet helper unit tests
        run: node --test tests/wallet-bootstrap.test.mjs tests/auth-flow.test.mjs tests/config-validator.test.mjs
      - name: Run Chromium smoke tests
        run: npx playwright test tests/ocean-desk.spec.mjs tests/auth-account.spec.mjs --browser=chromium --workers=1 --reporter=line
