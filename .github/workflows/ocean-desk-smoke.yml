name: Ocean Desk MVP browser checks
on:
  pull_request:
    paths:
      - index.html
      - od-account.js
      - od-focus-sync.js
      - tests/**
      - .github/workflows/ocean-desk-smoke.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ocean-desk-server.log 2>&1 &
      - name: Run Chromium smoke tests
        run: npx playwright test tests/ocean-desk.spec.mjs --browser=chromium --workers=1 --reporter=line
